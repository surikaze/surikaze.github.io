<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>José Pedro Azevedo – CV</title>
<!-- Print layout of the CV. Renders from js/data.js; build the PDF with tools/build-cv-pdf.ps1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14213d;
    --gold: #b8862b;
    --rule: #14213d;
    --ink: #1f1f1f;
    --muted: #565656;
    --sep: #979797;
    --row: #f1f3f7;
  }
  @page { size: A4; margin: 12mm 12mm 12mm 12mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    font-family: "Open Sans", Arial, sans-serif;
    font-size: 9.3pt;
    line-height: 1.34;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .page { max-width: 186mm; margin: 0 auto; }

  /* Header */
  header.top {
    background: var(--navy);
    color: #fff;
    padding: 5mm 6mm 4.5mm;
    margin-bottom: 5mm;
  }
  header.top h1 { margin: 0 0 2.5mm; font-family: "Source Serif 4", Georgia, serif; font-size: 22pt; font-weight: 600; letter-spacing: .2px; }
  header.top .rule { height: 2px; width: 22mm; background: var(--gold); margin: 0 0 2.5mm; }
  header.top .line { margin: 1mm 0; }
  header.top b { font-weight: 700; }
  header.top a { color: #fff; }
  header.top .pipe { color: rgba(255, 255, 255, .55); margin: 0 2.2mm; }

  /* Sections */
  section { margin-bottom: 3.5mm; }
  h2 {
    display: flex; align-items: center; gap: 2.4mm;
    margin: 0 0 2.5mm; padding-bottom: 1.2mm;
    font-size: 11pt; font-weight: 800; text-transform: uppercase; letter-spacing: .2px;
    border-bottom: 1px solid var(--rule);
    break-after: avoid;
  }
  h2::before { content: ""; width: 2mm; height: 2mm; border-radius: 50%; background: var(--gold); flex: none; }
  p { margin: 0 0 1.4mm; }
  b, strong { font-weight: 700; }

  /* Roles */
  .role { margin: 0 0 2.4mm; }
  .role-head, .role-rule, .role-focus { break-after: avoid; }
  li { break-inside: avoid; }
  .role-head { color: var(--muted); font-size: 9pt; margin-bottom: .6mm; }
  .role-head .t { font-weight: 700; font-size: 9.8pt; text-transform: uppercase; color: #4a4a4a; }
  .role-focus { font-weight: 700; color: #4a4a4a; margin: 0 0 .6mm; font-size: 9.2pt; }
  .role-rule { width: 75mm; height: 1px; background: #c3cad8; margin: 1mm 0 1.6mm; }
  ul { margin: 0; padding-left: 4.6mm; }
  li { margin: 0 0 .6mm; }
  li::marker { color: var(--gold); }

  /* Education / languages */
  .edu .meta { color: var(--muted); font-size: 9pt; }
  .edu .deg { font-weight: 700; text-transform: uppercase; font-size: 10pt; }
  table.lang { width: 100%; border-collapse: collapse; margin-top: 1.5mm; font-size: 9.2pt; }
  table.lang th, table.lang td { padding: 1.4mm 2mm; text-align: center; }
  table.lang th { font-weight: 700; }
  table.lang thead tr:first-child th { border-bottom: 1px solid var(--rule); }
  table.lang thead tr:last-child th { font-weight: 400; border-bottom: 1px solid var(--rule); }
  table.lang td { border-bottom: 1px solid var(--rule); }
  table.lang td:first-child, table.lang th:first-child { text-align: left; font-weight: 800; }
  table.lang tbody tr:nth-child(odd) td { background: var(--row); }
  .levels { font-style: italic; color: var(--muted); font-size: 8.4pt; margin-top: 1.2mm; }

  /* Skills */
  .skill-group { margin: 0 0 1.4mm; }
  .skill-group b { color: #333; }
  .skill-group .items span + span::before { content: "|"; color: var(--sep); margin: 0 1.8mm; }
  .soft { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
  .soft h3 { margin: 0 0 .6mm; font-size: 9.6pt; }
  .soft ul { padding-left: 4mm; }

  @media screen {
    body { background: #e9eceb; }
    .page { background: #fff; padding: 12mm; margin: 8mm auto; box-shadow: 0 2px 12px rgba(0, 0, 0, .12); max-width: 210mm; }
  }
</style>
</head>
<body>
<div class="page" id="cv"></div>
<script src="js/data.js"></script>
<script>
(() => {
  "use strict";
  const R = window.RESUME;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const ym = (v) => (v ? `${v.slice(5, 7)}/${v.slice(0, 4)}` : "Current");
  const linkedinLabel = decodeURIComponent(R.linkedin).replace(/^https?:\/\//, "");

  const roles = R.experience.map((r) => `
    <div class="role">
      <div class="role-head"><span class="t">${esc(r.title)} – ${esc(r.company)}</span> – ${ym(r.start)} – ${ym(r.end)} – ${esc(r.location.toUpperCase())}</div>
      <div class="role-rule"></div>
      ${r.focus ? `<p class="role-focus">${esc(r.focus)}</p>` : ""}
      <ul>${r.bullets.map((b) => `<li>${md(b)}</li>`).join("")}</ul>
    </div>`).join("");

  const LV = ["Listening", "Reading", "Spoken production", "Spoken interaction"];
  const native = R.languages.filter((l) => l.native).map((l) => l.name.toUpperCase()).join(", ");
  const others = R.languages.filter((l) => !l.native);

  const e = R.education;
  document.getElementById("cv").innerHTML = `
    <header class="top">
      <h1>${esc(R.name)}</h1>
      <div class="rule"></div>
      <div class="line"><b>${esc(R.title)}</b><span class="pipe">|</span>${esc(R.roles.slice(0, 3).join(" · "))}</div>
      <div class="line"><b>Email:</b> <a href="mailto:${esc(R.email)}">${esc(R.email)}</a><span class="pipe">|</span><b>LinkedIn:</b> <a href="${esc(R.linkedin)}">${esc(linkedinLabel)}</a></div>
      <div class="line"><b>Location:</b> ${esc(R.location)}<span class="pipe">|</span><b>Nationality:</b> Portuguese</div>
    </header>

    <section>
      <h2>About me</h2>
      ${R.summary.map((p) => `<p>${md(p)}</p>`).join("")}
    </section>

    <section>
      <h2>Work experience</h2>
      ${roles}
    </section>

    <section class="edu">
      <h2>Education and training</h2>
      <div class="deg">${esc(e.degree)}</div>
      <div class="meta">${esc(e.school)} · ${esc(e.location)} · ${esc(e.period)} · Field of study: ${esc(e.field)}</div>
    </section>

    <section style="break-inside: avoid">
      <h2>Language skills</h2>
      <p>Mother tongue(s): <b>${esc(native)}</b></p>
      <table class="lang">
        <thead>
          <tr><th></th><th colspan="2">UNDERSTANDING</th><th colspan="2">SPEAKING</th><th>WRITING</th></tr>
          <tr><th></th>${LV.map((l) => `<th>${l}</th>`).join("")}<th></th></tr>
        </thead>
        <tbody>
          ${others.map((l) => `<tr><td>${esc(l.name.toUpperCase())}</td>${l.levels.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
      <div class="levels">Levels: A1 and A2: Basic user; B1 and B2: Independent user; C1 and C2: Proficient user</div>
    </section>

    <section>
      <h2>Skills</h2>
      ${R.skills.map((c) => `<div class="skill-group"><b>${esc(c.category)}:</b> <span class="items">${c.items.map((s) => `<span>${esc(s.name)}</span>`).join("")}</span></div>`).join("")}
    </section>

    <section style="break-inside: avoid">
      <h2>Interpersonal and organizational skills</h2>
      <div class="soft">${R.softSkills.map((g) => `<div><h3>${esc(g.title)}</h3><ul>${g.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
    </section>`;
  document.documentElement.dataset.ready = "1";
})();
</script>
</body>
</html>
